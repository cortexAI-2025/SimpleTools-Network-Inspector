name: Android CI

on:
  push:
    branches: [ main, feature/**, fix/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # The repository does not yet contain Gradle wrapper files.
      # Pin a compatible Gradle distribution instead of invoking missing ./gradlew.
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build with Gradle
        run: gradle :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: gradle test --stacktrace

      - name: Run Android Lint
        run: gradle :app:lintDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleTools-Network-Inspector-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
